server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # TODO: Replace with your home server's Tailscale IP (find with: tailscale ip -4)
  - url: http://HOME_SERVER_TAILSCALE_IP:3100/loki/api/v1/push

scrape_configs:
  - job_name: lolapp
    static_configs:
      - targets:
          - localhost
        labels:
          job: lolapp-backend
          __path__: /var/log/lolapp/*.log
    pipeline_stages:
      - json:
          expressions:
            level: levelname
            message: message
            logger: name
      - labels:
          level:
          logger:
